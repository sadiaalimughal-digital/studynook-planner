:root{
  --paper:#fbf8f1;--grid:rgba(70,110,170,.10);--ink:#1d2742;--muted:#667085;--card:#ffffff;--line:#e7e1d3;
  --accent:#2f3e75;--accentInk:#ffffff;--hl:#ffe95c;--hl2:#b9f3d6;--tape:#1d2742;--tapeInk:#fff7c2;
  --danger:#e5484d;--warn:#f59e0b;--ok:#16a34a;
  --shadow:0 1px 0 rgba(29,39,66,.06),0 6px 18px -8px rgba(29,39,66,.18);
  --r:14px;--side:248px;
  --fs:"SN Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fd:"SN Display","SN Sans",Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fm:"SN Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}
[data-theme="campus"]{--paper:#f7f5ff;--grid:rgba(120,100,220,.10);--ink:#2a2350;--accent:#6c4cf0;--hl:#ffc9e3;--hl2:#d6ccff;--tape:#2a2350;--tapeInk:#ffd6ea;--line:#e6e1f7}
[data-theme="matcha"]{--paper:#f4f7ec;--grid:rgba(80,125,60,.12);--ink:#22301d;--accent:#4c7a35;--hl:#dcf2a6;--hl2:#ffe7a8;--tape:#22301d;--tapeInk:#e8f7c2;--line:#dfe6d2}
[data-theme="ocean"]{--paper:#f0f6fb;--grid:rgba(30,110,170,.10);--ink:#10304a;--accent:#1673b3;--hl:#b6e4ff;--hl2:#c4f1e6;--tape:#10304a;--tapeInk:#c9ecff;--line:#d9e6f0}
[data-theme="sunset"]{--paper:#fff6ef;--grid:rgba(230,120,80,.11);--ink:#3a2016;--accent:#e0582f;--hl:#ffd29b;--hl2:#ffc1c8;--tape:#3a2016;--tapeInk:#ffe2bf;--line:#f1e0d3}
[data-theme="mono"]{--paper:#f6f6f3;--grid:rgba(0,0,0,.06);--ink:#141414;--accent:#141414;--hl:#e4e4de;--hl2:#efefea;--tape:#141414;--tapeInk:#f2f2f2;--line:#e2e2dc}
.dark{--paper:#11172b;--grid:rgba(140,160,255,.07);--ink:#e8ebff;--muted:#9aa3c9;--card:#19213b;--line:#2a3459;--tape:#e8ebff;--tapeInk:#11172b;--shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -10px rgba(0,0,0,.6);--hl:rgba(255,226,80,.28);--hl2:rgba(110,240,190,.22);--accentInk:#0d1224}
.dark{--accent:#ffd84d}
.dark[data-theme="campus"]{--accent:#b9a4ff;--hl:rgba(255,120,190,.28)}
.dark[data-theme="matcha"]{--accent:#b6e66b;--hl:rgba(182,230,107,.25)}
.dark[data-theme="ocean"]{--accent:#6cc8ff;--hl:rgba(108,200,255,.25)}
.dark[data-theme="sunset"]{--accent:#ff9a6b;--hl:rgba(255,154,107,.26)}
.dark[data-theme="mono"]{--accent:#f2f2f2;--hl:rgba(255,255,255,.14)}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--fs);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.lg{width:22px;height:22px}
.hide{display:none!important}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--fm);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

/* ===== layout ===== */
#app{display:flex;min-height:100vh}
#side{width:var(--side);flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 18px 0;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 14px 14px 20px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:#ffe95c;display:grid;place-items:center;border:2px solid #1d2742;transform:rotate(-4deg)}
.brand .logo svg{width:22px;height:22px}
.brand b{font-family:var(--fd);font-size:21px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:var(--fm);font-size:9.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.navgroup{font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:10px 20px 3px}
.navlink{display:flex;align-items:center;gap:11px;padding:6.5px 14px 6.5px 20px;border-radius:0 999px 999px 0;cursor:pointer;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;border:0;background:none;width:100%;text-align:left;position:relative}
.navlink:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.navlink.on{background:var(--hl);box-shadow:inset 4px 0 0 var(--ink)}
.navlink .ic{opacity:.85}
.navlink .badge{margin-left:auto}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:16px 28px 6px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper) 70%,transparent)}
#top h1{margin:0;font-family:var(--fd);font-size:28px;letter-spacing:-.025em;line-height:1.1}
#top h1 span{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 4px}
#main{padding:10px 28px 40px;max-width:1320px;width:100%}
#bnav{display:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{border-color:var(--ink)}
.searchbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted);min-width:220px}
.searchbtn kbd{margin-left:auto;font-family:var(--fm);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#demoBar{margin:4px 28px 0;max-width:1264px}
.demobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--tape);color:var(--tapeInk);border-radius:12px;padding:9px 14px;font-size:14px}
.demobar .btn{background:var(--hl);color:#1d2742;border-color:transparent}

/* ===== components ===== */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dash{grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.c3{grid-column:span 3}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;min-width:0}
.card.tape::before{content:"";position:absolute;top:-9px;left:22px;width:74px;height:18px;background:var(--hl);opacity:.9;transform:rotate(-3deg);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card.tape2::before{content:"";position:absolute;top:-9px;right:22px;width:64px;height:18px;background:var(--hl2);transform:rotate(4deg);border-radius:2px}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:28px}
.chead h3{margin:0;font-family:var(--fd);font-size:17px;letter-spacing:-.01em}
.label{display:inline-block;font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--tape);color:var(--tapeInk);padding:3px 8px 2px;border-radius:4px;line-height:1.3}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hl{background:var(--hl);border-color:transparent;color:var(--ink)}
.dark .btn.hl{color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px;gap:4px}
.btn .ic{width:16px;height:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#1d2742;background:#eee;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.out{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.badge{font-family:var(--fm);font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--paper)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-now{background:#ffe1e1;color:#b42318}.p-soon{background:#ffefd1;color:#9a5b00}.p-later{background:#dff5e6;color:#17663a}.p-done{background:#e9ecf3;color:#5b6475}
.dark .p-now{background:#4a1d24;color:#ffb4b4}.dark .p-soon{background:#4a3613;color:#ffd38a}.dark .p-later{background:#173b29;color:#9ff0c0}.dark .p-done{background:#273050;color:#aab3d6}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-family:var(--fd);font-size:16px;margin-bottom:3px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12.5px}
.clickable{cursor:pointer}
.clickable:hover{background:color-mix(in srgb,var(--hl) 25%,transparent)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none;background:var(--card)}
.check.on{background:var(--ink);color:var(--paper)}
.check:not(.on) .ic{opacity:0}
.check:not(.on):hover .ic{opacity:.3}
.check .ic{width:14px;height:14px;stroke-width:3}
.done-t{text-decoration:line-through;color:var(--muted)}
.bar{height:9px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.big{font-family:var(--fd);font-size:34px;letter-spacing:-.03em;line-height:1}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hlt{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 90%,transparent 90%);padding:0 3px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line);font-weight:700}
.tbl td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 10%,transparent) 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:13px}
.sticky{background:#fff6a8;color:#3b3420;padding:14px;border-radius:4px 4px 14px 4px;box-shadow:0 8px 16px -10px rgba(0,0,0,.35);transform:rotate(-1deg);font-size:14px}
.dark .sticky{background:#4b4420;color:#fff6c8}
.quote{font-family:var(--fd);font-size:19px;letter-spacing:-.01em;line-height:1.3}

/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.field label{display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp,.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px;outline:none}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input.inp{height:40px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:30px;height:30px;border-radius:9px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatches input:checked+span{border-color:var(--ink);transform:scale(1.08)}
.cbx{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.cbx input{width:18px;height:18px;accent-color:var(--accent)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(14,18,35,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow-y:auto;backdrop-filter:blur(2px)}
#modal.open{display:flex}
.mbox{background:var(--card);border-radius:18px;width:100%;max-width:560px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border:1.5px solid var(--line);position:relative}
.mbox.wide{max-width:760px}
.mbox h2{margin:0 0 16px;font-family:var(--fd);font-size:22px;letter-spacing:-.02em;padding-right:40px}
.mclose{position:absolute;top:14px;right:14px}
.mact{display:flex;gap:8px;align-items:center;grid-column:1/-1;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--tape);color:var(--tapeInk);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* welcome */
#welcome{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;overflow-y:auto;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wbox{max-width:620px;width:100%;text-align:center}
.wbox h1{font-family:var(--fd);font-size:clamp(34px,6vw,54px);letter-spacing:-.035em;line-height:1.02;margin:16px 0 10px}
.wbox h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
.wbox p{color:var(--muted);font-size:17px;margin:0 auto 22px;max-width:480px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}
.wopt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;color:var(--ink)}
.wopt:hover{border-color:var(--ink);transform:translateY(-2px)}
.wopt b{font-family:var(--fd);font-size:18px;display:block;margin:10px 0 4px}
.wopt span{color:var(--muted);font-size:14px}
.wopt .ic{width:28px;height:28px}

/* timetable */
.tt{padding-bottom:12px;display:grid;grid-template-columns:54px repeat(var(--days),minmax(110px,1fr));min-width:calc(54px + var(--days)*110px)}
.tt .th{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:8px 0;border-bottom:1.5px solid var(--line)}
.tt .th.today{background:var(--hl);border-radius:8px 8px 0 0}
.tt .hours{position:relative}
.tt .hours div{position:absolute;right:8px;font-family:var(--fm);font-size:10.5px;color:var(--muted);transform:translateY(-50%)}
.tt .col{position:relative;border-left:1px dashed var(--line)}
.tt .hl-line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.cls{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px;font-size:12px;color:#1d2742;overflow:hidden;cursor:pointer;border:1.5px solid rgba(0,0,0,.08);line-height:1.25}
.cls b{display:block;font-size:12.5px}
.cls:hover{filter:brightness(.97);box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:104px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day:hover{border-color:var(--ink)}
.cal .day.other{opacity:.45}
.cal .day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .dn{font-weight:700;font-size:13px}
.cal .today .dn{background:var(--hl);border-radius:6px;padding:0 5px;align-self:flex-start}
.ev{font-size:11.5px;padding:1px 6px;border-radius:5px;color:#1d2742;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.exam{background:#1d2742!important;color:#fff}
.dark .ev.exam{background:#e8ebff!important;color:#11172b}
.evdots{display:none;gap:3px;flex-wrap:wrap}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bcol{background:color-mix(in srgb,var(--card) 60%,transparent);border:1.5px dashed var(--line);border-radius:14px;padding:10px;min-height:200px}
.bcol h4{margin:4px 4px 10px;display:flex;align-items:center;gap:8px;font-family:var(--fd)}
.bcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;box-shadow:var(--shadow)}
.bcard .stripe{height:5px;border-radius:9px;margin:-2px 0 8px;width:46px}

/* focus */
.timerwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.tring{position:relative;width:250px;height:250px}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .tt-read{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.tring .tt-read b{font-family:var(--fm);font-size:52px;letter-spacing:-.02em;display:block;line-height:1}
.city{width:100%;overflow-x:auto;border-radius:12px;border:1.5px solid var(--line)}
.city svg{display:block}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;justify-content:start;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.heat i.l4{background:var(--accent)}

/* flashcards */
.fc{perspective:1200px;width:100%;max-width:560px;height:300px;margin:0 auto;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:2px solid var(--ink);display:grid;place-items:center;padding:28px;text-align:center;font-size:21px;font-weight:600;overflow:auto;background:var(--card);
  background-image:linear-gradient(transparent 31px,color-mix(in srgb,var(--accent) 16%,transparent) 32px);background-size:100% 32px}
.fc .back{transform:rotateY(180deg);background-color:var(--hl2)}
.fc .face small{position:absolute;top:12px;left:14px}
.boxes{display:flex;gap:6px}
.boxes div{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:9px;padding:6px 2px;font-size:12px}
.boxes b{display:block;font-family:var(--fd);font-size:18px}

/* cornell */
.cornell{display:grid;grid-template-columns:30% 1fr;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.cornell textarea{border:0;outline:none;width:100%;resize:vertical;background:transparent;padding:14px;font-size:15px;line-height:28px;min-height:360px;
  background-image:linear-gradient(transparent 27px,color-mix(in srgb,var(--accent) 14%,transparent) 28px);background-size:100% 28px;background-attachment:local}
.cornell .cue{border-right:2px solid var(--ink);background-color:color-mix(in srgb,var(--hl) 22%,var(--card))}
.cornell .sum{grid-column:1/-1;border-top:2px solid var(--ink)}
.cornell .sum textarea{min-height:110px}
.cornell .lab{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px 0;color:var(--muted)}

/* habits */
.hgrid{border-collapse:separate;border-spacing:3px}
.hgrid td,.hgrid th{padding:0;text-align:center}
.hgrid th{font-family:var(--fm);font-size:9.5px;color:var(--muted);font-weight:700;width:24px}
.hgrid td.hn{text-align:left;padding-right:10px;font-weight:600;white-space:nowrap;font-size:14px}
.hc{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;display:block;background:var(--card)}
.hc.on{background:var(--accent);border-color:var(--accent)}
.hc.td{border-color:var(--ink)}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods button{width:46px;height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.moods button.on{background:var(--hl);border-color:var(--ink)}
.moods .ic{width:24px;height:24px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:36px;border:0;background:var(--card);cursor:pointer;font-size:18px;font-weight:700}
.stepper span{min-width:48px;text-align:center;font-weight:700}
.mstrip{display:flex;gap:4px;flex-wrap:wrap}
.mstrip i{width:16px;height:16px;border-radius:4px;background:color-mix(in srgb,var(--ink) 8%,transparent)}

/* palette */
.pal input{width:100%;height:50px;border:0;border-bottom:1.5px solid var(--line);background:transparent;font-size:18px;outline:none;padding:0 4px}
.pal .res{max-height:52vh;overflow-y:auto;margin-top:8px}
.pal .ri{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer}
.pal .ri.sel,.pal .ri:hover{background:var(--hl)}
.pal .ri small{margin-left:auto;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qadd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qadd button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.qadd button:hover{border-color:var(--ink);background:var(--hl)}
.morepages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.morepages button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.morepages button.on{background:var(--hl);border-color:var(--ink)}

.help h3{font-family:var(--fd);margin:0 0 6px}
.help p,.help li{color:var(--ink)}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help li{margin:4px 0}
.kbd{font-family:var(--fm);font-size:12px;border:1.5px solid var(--line);border-radius:6px;padding:0 5px}
.nudge{display:flex;gap:12px;align-items:center;background:var(--hl2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink)}

/* ===== responsive ===== */
@media (max-width:1180px){
  .dash .c4,.dash .c5{grid-column:span 6}.dash .c7,.dash .c8{grid-column:span 12}.dash .c3{grid-column:span 6}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  :root{--side:210px}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .searchbtn{min-width:0}.searchbtn span,.searchbtn kbd{display:none}
}
@media (max-width:760px){
  body{font-size:15px}
  #side{display:none}
  #top{padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
  #top h1{font-size:21px}
  .demobar{padding:8px 10px;font-size:13px;gap:8px}
  .g3k{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  #main{padding:8px 14px calc(96px + env(safe-area-inset-bottom))}
  #demoBar{margin:4px 14px 0}
  .dash .c3,.dash .c4,.dash .c5,.dash .c6,.dash .c7,.dash .c8{grid-column:span 12}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:1fr}
  .card{padding:14px}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  #bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 0;border-radius:12px;cursor:pointer}
  #bnav button.on{color:var(--ink);background:var(--hl)}
  #bnav .ic{width:22px;height:22px}
  .board{grid-template-columns:minmax(0,1fr)}
  .cal{gap:3px}
  .cal .day{min-height:54px;padding:4px;border-radius:8px}
  .cal .ev{display:none}
  .cal .evdots{display:flex}
  .cal .evdots i{width:6px;height:6px;border-radius:50%}
  .cornell{grid-template-columns:1fr}
  .cornell .cue{border-right:0;border-bottom:2px solid var(--ink)}
  .cornell textarea{min-height:200px}
  .wopts{grid-template-columns:1fr}
  .tring{width:220px;height:220px}
  .tring .tt-read b{font-size:44px}
  .big{font-size:28px}
  .mbox{padding:18px;border-radius:16px}
  #modal{padding:12px 10px;align-items:flex-start}
  .qadd{grid-template-columns:repeat(3,1fr)}
  .hide-m{display:none!important}
  .tbl{font-size:13px}
}
@media (min-width:761px){.show-m{display:none!important}}

/* ===== print ===== */
@media print{
  body{background:#fff!important}
  #side,#bnav,#top .iconbtn,#top .searchbtn,#demoBar,.toolbar,.noprint{display:none!important}
  #main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .card.tape::before,.card.tape2::before{display:none}
  .dash .c3,.dash .c4,.dash .c5,.dash .c6,.dash .c7,.dash .c8{grid-column:span 6}
}

</style>
</head>
<body>
<div id="welcome" class="hide"></div>
<div id="app" class="hide">
  <aside id="side" aria-label="Pages"></aside>
  <div id="mainwrap">
    <header id="top">
      <h1 id="ptitle"></h1><span class="sp"></span>
      <button class="searchbtn" data-a="search" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search everything</span><kbd>Ctrl K</kbd></button>
      <button class="iconbtn" data-a="quickAdd" aria-label="Quick add" style="background:var(--accent);color:var(--accentInk);border-color:var(--accent)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" id="darkBtn" data-a="dark" aria-label="Dark mode"></button>
    </header>
    <div id="demoBar"></div>
    <main id="main"></main>
  </div>
  <nav id="bnav" aria-label="Main"></nav>
</div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Study Nook icon set (original, stroke icons on a 24px grid) */
const ICONS={
home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>',
exam:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/>',
cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/><path d="M22 9v6"/>',
timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>',

function classesOn(dateStr){const d=parse(dateStr).getDay();const wt=weekType(dateStr);return S.classes.filter(c=>Number(c.day)===d&&(c.week==='all'||!c.week||c.week===wt)).sort((a,b)=>toMin(a.start)-toMin(b.start))}

function eventsOn(ds){const ev=[];
  S.exams.forEach(e=>{if(e.date===ds)ev.push({t:e.title,c:sColor(e.subjectId),k:'exam',a:'editExam',id:e.id,time:e.time});(e.revision||[]).forEach(r=>{if(r.date===ds)ev.push({t:'Revise: '+r.label,c:sColor(e.subjectId),k:'rev',a:'go',p:'exams'})})});
  S.assignments.forEach(a=>{if(a.due===ds)ev.push({t:a.title,c:sColor(a.subjectId),k:a.status==='done'?'done':'as',a:'editAssign',id:a.id})});
  S.opps.forEach(o=>{if(o.deadline===ds)ev.push({t:o.name+' deadline',c:'#d9dce6',k:'opp',a:'editOpp',id:o.id})});
  S.projects.forEach(p=>{if(p.due===ds)ev.push({t:p.name+' due',c:sColor(p.subjectId),k:'proj',a:'go',p:'projects'});(p.meetings||[]).forEach(m=>{if(m.date===ds)ev.push({t:'Meet: '+p.name,c:'#e8e3d4',k:'meet',a:'go',p:'projects'})})});
  return ev}
PAGES.calendar=()=>{
  const T0=today();if(!UI.calMonth)UI.calMonth=T0.slice(0,7);
  const [y,m]=UI.calMonth.split('-').map(Number);const first=new Date(y,m-1,1);const ws=S.settings.weekStart;
  const start=new Date(first);start.setDate(1-((first.getDay()-ws+7)%7));
  const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(ymd(d))}
  const rows=cells[35].slice(0,7)===UI.calMonth?42:35;
  const title=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const up=[];for(let i=0;i<14;i++){const ds=addDays(T0,i);eventsOn(ds).forEach(e=>{if(e.k!=='done')up.push([ds,e])})}
  return '<div class="toolbar"><button class="iconbtn" data-a="calNav" data-d="-1" aria-label="Previous month">'+ic('left')+'</button><button class="iconbtn" data-a="calNav" data-d="1" aria-label="Next month">'+ic('right')+'</button><h2 style="margin:0 6px;font-family:var(--fd);font-size:22px">'+esc(title)+'</h2><button class="btn sm" data-a="calNav" data-d="0">Today</button><span class="sp"></span><button class="btn sm" data-a="exportIcs">'+ic('download')+'<span class="hide-m">Export to calendar (.ics)</span><span class="show-m">.ics</span></button><button class="btn sm pri" data-a="quickAdd">'+ic('plus')+'Add</button></div>'+
  '<div class="grid" style="grid-template-columns:minmax(0,1fr)"><div class="card" style="padding:12px"><div class="cal">'+Array.from({length:7},(_,i)=>'<div class="dow">'+DOW[(i+ws)%7]+'</div>').join('')+
  cells.slice(0,rows).map(ds=>{const ev=eventsOn(ds);const cl=classesOn(ds).length;
    return '<div class="day'+(ds.slice(0,7)!==UI.calMonth?' other':'')+(ds===T0?' today':'')+'" data-a="calDay" data-d="'+ds+'"><div class="row nw" style="gap:4px"><span class="dn">'+parse(ds).getDate()+'</span><span class="sp"></span>'+(cl?'<span class="mono muted hide-m" style="font-size:10px">'+cl+' cls</span>':'')+'</div>'+
    ev.slice(0,3).map(e=>'<div class="ev'+(e.k==='exam'?' exam':'')+(e.k==='done'?' done-t':'')+'" style="background:'+e.c+'">'+esc(e.t)+'</div>').join('')+(ev.length>3?'<div class="small muted hide-m" style="font-size:11px">+'+(ev.length-3)+' more</div>':'')+
    '<div class="evdots">'+ev.slice(0,4).map(e=>'<i style="background:'+(e.k==='exam'?'var(--ink)':e.c)+'"></i>').join('')+'</div></div>'}).join('')+'</div></div>'+
  '<div class="card"><div class="chead"><h3>Next 14 days</h3></div>'+(up.length?'<div class="list">'+up.slice(0,14).map(([ds,e])=>'<div class="li clickable" data-a="'+e.a+'" data-id="'+(e.id||'')+'" data-p="'+(e.p||'')+'"><span class="mono small" style="width:86px;flex:none">'+esc(fmtDay(ds))+'</span><span class="dot" style="background:'+(e.k==='exam'?'var(--ink)':e.c)+'"></span><div class="t"><b>'+esc(e.t)+'</b></div>'+(e.k==='exam'?'<span class="label">Exam</span>':'')+'</div>').join('')+'</div>':emptyBox('Nothing coming up','Deadlines, exams and meetings show here.'))+'</div></div>';
};

function examForm(e){e=e||{date:addDays(today(),14),subjectId:(S.subjects[0]||{}).id};const topics=(e.topics||[]).map(t=>t.name).join('\n');
  form(e.id?'Edit exam':'New exam',[{k:'title',l:'Exam name',req:1,full:1,ph:'e.g. Biology final'},{k:'subjectId',l:SW(),t:'select',opt:()=>subjOpts('General')},{k:'date',l:'Date',t:'date',req:1},{k:'time',l:'Time',t:'time'},{k:'room',l:'Room'},{k:'tp',l:'Topics (one per line)',t:'textarea',ph:'Chapter 1\nChapter 2'}],Object.assign({},e,{tp:topics}),o=>{
    const old=e.topics||[];o.topics=o.tp.split('\n').map(x=>x.trim()).filter(Boolean).map(n=>old.find(t=>t.name===n)||{id:uid(),name:n,conf:0});delete o.tp;o.id=e.id;if(!e.id)o.revision=[];upsert('exams',o)},{onDelete:e.id?()=>del('exams',e.id):null})}
function genRevision(e){const T0=today();const left=diffDays(T0,e.date);if(left<1){toast('The exam is today or has passed');return}
  const offs=[21,14,10,7,5,3,2,1].filter(o=>o<=left&&o>=1);const topics=(e.topics||[]).slice().sort((a,b)=>a.conf-b.conf);
  const keep=(e.revision||[]).filter(r=>r.done);const out=[];
  offs.forEach((o,i)=>{const ds=addDays(e.date,-o);let label;if(o===1)label='Final review + rest well';else if(i===offs.length-2&&offs.length>2)label='Full practice paper';else label=topics.length?topics[i%topics.length].name:'Review notes & flashcards';out.push({id:uid(),date:ds,label,done:false})});
  e.revision=keep.concat(out);toast('Revision plan created: '+out.length+' sessions')}

const SCALE=[[93,'A',4],[90,'A-',3.7],[87,'B+',3.3],[83,'B',3],[80,'B-',2.7],[77,'C+',2.3],[73,'C',2],[70,'C-',1.7],[67,'D+',1.3],[65,'D',1],[0,'F',0]];
const letter=p=>SCALE.find(s=>p>=s[0])[1];const points=p=>SCALE.find(s=>p>=s[0])[2];
function subjectGrade(id){const it=S.grades.filter(g=>g.subjectId===id&&g.max>0&&g.score!=='');const w=sum(it,g=>Number(g.weight)||0);if(!it.length||!w)return null;return sum(it,g=>g.score/g.max*100*(Number(g.weight)||0))/w}
function termGPA(){let pts=0,cr=0,pc=0,n=0;S.subjects.forEach(s=>{const g=subjectGrade(s.id);if(g==null)return;const c=Number(s.credits)||1;pts+=points(g)*c;cr+=c;pc+=g;n++});return{gpa:cr?pts/cr:null,credits:cr,avg:n?pc/n:null}}
PAGES.grades=()=>{
  const tg=termGPA();const gpaMode=S.settings.scale==='gpa';
  let cumPts=0,cumCr=0;S.pastTerms.forEach(p=>{cumPts+=(Number(p.gpa)||0)*(Number(p.credits)||0);cumCr+=Number(p.credits)||0});if(tg.gpa!=null){cumPts+=tg.gpa*tg.credits;cumCr+=tg.credits}
  return '<div class="toolbar"><button class="btn pri" data-a="addGrade">'+ic('plus')+'Add grade</button><span class="sp"></span><button class="btn sm" data-a="print">'+ic('print')+'Print</button></div>'+
  '<div class="grid g4" style="margin-bottom:16px">'+
   '<div class="card tape"><div class="stat"><span class="k">'+(gpaMode?'This term GPA':'This term average')+'</span><span class="big num">'+(gpaMode?(tg.gpa!=null?tg.gpa.toFixed(2):'–'):(tg.avg!=null?tg.avg.toFixed(1)+'%':'–'))+'</span><span class="small muted">'+(gpaMode?tg.credits+' credits graded':'across '+S.subjects.length+' '+esc(SW().toLowerCase())+'s')+'</span></div></div>'+
   (gpaMode?'<div class="card"><div class="stat"><span class="k">Overall GPA</span><span class="big num">'+(cumCr?(cumPts/cumCr).toFixed(2):'–')+'</span><span class="small muted">incl. '+plural(S.pastTerms.length,'past term')+' · <a href="#" data-a="addPast">add</a></span></div></div>':'<div class="card"><div class="stat"><span class="k">Graded items</span><span class="big num">'+S.grades.length+'</span></div></div>')+
   '<div class="card c6" style="grid-column:span 2"><div class="chead"><h3>What do I need on the final?</h3></div><form class="row" data-f="need" style="gap:8px"><div class="field" style="flex:1;min-width:90px"><label>Current %</label><input class="inp" name="cur" type="number" step="any" inputmode="decimal" value="'+(UI.need?UI.need.cur:'')+'"></div><div class="field" style="flex:1;min-width:90px"><label>Final worth %</label><input class="inp" name="w" type="number" step="any" inputmode="decimal" value="'+(UI.need?UI.need.w:'')+'"></div><div class="field" style="flex:1;min-width:90px"><label>Goal %</label><input class="inp" name="goal" type="number" step="any" inputmode="decimal" value="'+(UI.need?UI.need.goal:'')+'"></div><button class="btn hl" style="align-self:flex-end">Calculate</button></form><div id="needOut" style="margin-top:8px;font-weight:600">'+(UI.needOut||'')+'</div></div>'+
  '</div>'+
  (S.subjects.length?'<div class="grid g2">'+S.subjects.map(s=>{const it=S.grades.filter(g=>g.subjectId===s.id);const g=subjectGrade(s.id);const tw=sum(it,x=>Number(x.weight)||0);
    return '<div class="card"><div class="row nw" style="gap:12px;margin-bottom:10px"><span style="width:10px;align-self:stretch;border-radius:5px;background:'+s.color+'"></span><div style="flex:1;min-width:0"><b style="font-family:var(--fd);font-size:17px">'+esc(s.name)+'</b><div class="small muted">'+(s.credits||0)+' credits · '+Math.round(tw)+'% of grade entered</div></div>'+
    (g!=null?'<div style="text-align:right"><div class="big num" style="font-size:28px">'+g.toFixed(1)+'%</div><div class="mono small">'+letter(g)+(gpaMode?' · '+points(g).toFixed(1):'')+'</div></div>':'<span class="muted small">No grades</span>')+'</div>'+
    (it.length?'<div class="scrollx"><table class="tbl"><thead><tr><th>Item</th><th>Score</th><th>%</th><th>Weight</th></tr></thead><tbody>'+it.map(x=>'<tr class="clickable" data-a="editGrade" data-id="'+x.id+'"><td><b style="font-weight:600">'+esc(x.name)+'</b><div class="small muted">'+esc(x.category||'')+'</div></td><td class="num">'+x.score+'/'+x.max+'</td><td class="num">'+(x.max?(x.score/x.max*100).toFixed(0):0)+'%</td><td class="num">'+(x.weight||0)+'%</td></tr>').join('')+'</tbody></table></div>':'')+
    '<button class="btn xs" style="margin-top:10px" data-a="addGrade" data-s="'+s.id+'">'+ic('plus')+'Add grade</button></div>'}).join('')+'</div>':emptyBox('Add your '+SW().toLowerCase()+'s first','Then add test, quiz and homework scores to see your grades and GPA.','<button class="btn hl" data-a="addSubject">'+ic('plus')+'Add '+esc(SW().toLowerCase())+'</button>'))+
  (gpaMode&&S.pastTerms.length?'<div class="card" style="margin-top:16px"><div class="chead"><h3>Past terms</h3><span class="sp"></span><button class="btn xs" data-a="addPast">'+ic('plus')+'Add</button></div><div class="list">'+S.pastTerms.map(p=>'<div class="li clickable" data-a="editPast" data-id="'+p.id+'"><div class="t"><b>'+esc(p.name)+'</b></div><span class="num">GPA <b>'+Number(p.gpa).toFixed(2)+'</b> · '+p.credits+' cr</span></div>').join('')+'</div></div>':'')+
  '<p class="small muted" style="margin-top:12px">Grades use weights: each item counts by its "weight" (% of the final grade). '+(gpaMode?'GPA uses a standard 4.0 scale (A = 93%+) weighted by credits.':'Switch to a 4.0 GPA scale in Settings.')+'</p>';
};
function gradeForm(g){g=g||{subjectId:(S.subjects[0]||{}).id,max:100,weight:10};
  form(g.id?'Edit grade':'Add grade',[{k:'name',l:'Name',req:1,full:1,ph:'e.g. Quiz 3'},{k:'subjectId',l:SW(),t:'select',opt:()=>subjOpts()},{k:'category',l:'Category',t:'select',opt:S.cats.gradeCat},{k:'score',l:'Score',t:'number',step:'any',req:1},{k:'max',l:'Out of',t:'number',step:'any',req:1},{k:'weight',l:'Weight (% of final grade)',t:'number',step:'any'}],g,o=>{o.id=g.id;upsert('grades',o)},{onDelete:g.id?()=>del('grades',g.id):null})}

/* ---------- FOCUS ---------- */
const T={mode:'focus',left:null,total:null,running:false,endAt:0,subjectId:'',count:0,sound:'off',vol:.35};
const fmtClock=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function modeLen(m){return (m==='focus'?S.settings.focus:m==='short'?S.settings.short:S.settings.long)*60}
function timerSet(m){T.mode=m;T.running=false;T.total=modeLen(m);T.left=T.total;noise(false);timerPaint();render()}
function timerPaint(){if(!S)return;if(T.left==null){T.total=modeLen(T.mode);T.left=T.total}
  const r=$('#tRead');if(r)r.textContent=fmtClock(T.left);const c=$('#tRing');if(c){const L=2*Math.PI*110;c.style.strokeDasharray=L;c.style.strokeDashoffset=L*(1-T.left/T.total)}
  const b=$('#tBtn');if(b)b.innerHTML=T.running?ic('pause')+'Pause':ic('play')+(T.left<T.total?'Resume':'Start');
  if(T.running)document.title=fmtClock(T.left)+' · Study Nook'}
setInterval(()=>{if(!T.running)return;T.left=Math.max(0,Math.round((T.endAt-Date.now())/1000));timerPaint();if(T.left<=0)timerDone()},500);
function timerDone(){T.running=false;noise(false);chime();document.title='Study Nook';
  if(T.mode==='focus'){const mins=Math.round(T.total/60);S.sessions.push({id:uid(),date:today(),subjectId:T.subjectId,minutes:mins});T.count++;save();
    toast('Focus session done! +'+mins+' minutes'+(mins>=S.settings.focus?' and a new building in Study City':''));T.mode=T.count%4===0?'long':'short'}
  else{toast('Break over. Ready for the next session?');T.mode='focus'}
  T.total=modeLen(T.mode);T.left=T.total;render()}
let AC,NS,NG;
function chime(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=[660,880,990][i];o.type='sine';g.gain.setValueAtTime(0,AC.currentTime+t);g.gain.linearRampToValueAtTime(.2,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.5);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.55)})}catch(e){}}
function noise(on){try{if(NS){NS.stop();NS.disconnect();NS=null}if(!on||T.sound==='off')return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(T.sound==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
  NS=AC.createBufferSource();NS.buffer=buf;NS.loop=true;NG=AC.createGain();NG.gain.value=T.vol*(T.sound==='white'?.35:1);let node=NS;
  if(T.sound==='rain'){const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;node.connect(hp);hp.connect(lp);node=lp;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.13;lg.gain.value=T.vol*.25;lfo.connect(lg).connect(NG.gain);lfo.start()}
  node.connect(NG).connect(AC.destination);NS.start()}catch(e){}}
function cityData(){const st=S.settings.termStart;const ss=S.sessions.filter(s=>s.date>=st).sort((a,b)=>a.date<b.date?-1:1);const per=S.settings.focus||25;let acc=0;const b=[];
  ss.forEach(s=>{acc+=s.minutes;while(acc>=per){acc-=per;b.push(sColor(s.subjectId))}});return{b,rest:acc,per}}
function cityHTML(h){const {b,rest,per}=cityData();const max=300;const shown=b.slice(-max);const n=shown.length;const W=Math.max(600,n*24+70);const H=h||190;const dark=S.settings.dark;
  let seed=11;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:'+W+'px;height:'+H+'px;max-width:none;min-width:100%" preserveAspectRatio="xMinYMax slice" role="img" aria-label="Study City with '+b.length+' buildings"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+(dark?'#0b1024':'#cfe9ff')+'"/><stop offset="1" stop-color="'+(dark?'#2a2f6b':'#fff3d6')+'"/></linearGradient></defs><rect width="'+W+'" height="'+H+'" fill="url(#sky)"/>';
  if(dark){for(let i=0;i<W/18;i++)s+='<circle cx="'+(R()*W).toFixed(0)+'" cy="'+(R()*H*.55).toFixed(0)+'" r="'+(R()*1.3+.3).toFixed(1)+'" fill="#fff" opacity="'+(R()*.7+.2).toFixed(2)+'"/>';s+='<circle cx="'+(W-60)+'" cy="34" r="16" fill="#fff6c8"/><circle cx="'+(W-53)+'" cy="29" r="14" fill="#1a1f4a"/>'}
  else s+='<circle cx="'+(W-60)+'" cy="36" r="18" fill="#ffd84d"/><g fill="#fff" opacity=".9"><ellipse cx="120" cy="40" rx="34" ry="10"/><ellipse cx="146" cy="34" rx="22" ry="10"/><ellipse cx="'+(W*.55).toFixed(0)+'" cy="28" rx="30" ry="9"/></g>';
  const gy=H-18;
  shown.forEach((c,i)=>{const x=20+i*24,w=20,bh=Math.round(34+R()*(H-90));const y=gy-bh;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+bh+'" rx="2" fill="'+c+'" stroke="'+(dark?'#0b1024':'#1d2742')+'" stroke-width="1.2"/>';
    if(R()<.3)s+='<rect x="'+(x+8)+'" y="'+(y-7)+'" width="3" height="7" fill="'+(dark?'#c8cdf0':'#1d2742')+'"/>';
    for(let wy=y+6;wy<gy-8;wy+=10)for(const wx of [x+4,x+12])s+='<rect x="'+wx+'" y="'+wy+'" width="4" height="5" fill="'+(dark?(R()<.6?'#ffe98a':'#3b3f6e'):'#ffffff')+'" opacity="'+(dark?1:.75)+'"/>'});
  const nx=20+n*24;const ph=Math.round(rest/per*60);
  s+='<rect x="'+nx+'" y="'+(gy-60)+'" width="20" height="60" fill="none" stroke="'+(dark?'#9aa3c9':'#667085')+'" stroke-dasharray="3 3" stroke-width="1.2"/>'+(ph?'<rect x="'+nx+'" y="'+(gy-ph)+'" width="20" height="'+ph+'" fill="'+(dark?'#ffd84d':'#ffe95c')+'" opacity=".8"/>':'')+
    '<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="'+(dark?'#9aa3c9':'#1d2742')+'" stroke-width="2"/><rect x="0" y="'+gy+'" width="'+W+'" height="18" fill="'+(dark?'#1b2145':'#e9e1cc')+'"/></svg>';
  return '<div class="city" id="cityBox">'+s+'</div><div class="row small muted" style="margin-top:8px"><span><b style="color:var(--ink)">'+b.length+'</b> buildings this term</span><span class="sp"></span><span>Next building: '+Math.round(rest)+'/'+per+' min</span></div>'}
function heatHTML(){const T0=today();const end=addDays(weekStartOf(T0),6);const start=addDays(end,-18*7+1);const m={};S.sessions.forEach(s=>m[s.date]=(m[s.date]||0)+s.minutes);
  let h='';for(let d=start;d<=end;d=addDays(d,1)){const v=m[d]||0;const l=d>T0?'':v===0?'':v<30?'l1':v<60?'l2':v<120?'l3':'l4';h+='<i class="'+l+'" title="'+esc(fmtDay(d))+': '+fmtMin(v)+'"'+(d>T0?' style="opacity:.3"':'')+'></i>'}return '<div class="heat">'+h+'</div>'}

    '<div class="tring"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="110" fill="none" stroke="color-mix(in srgb,var(--ink) 9%,transparent)" stroke-width="14"/><circle id="tRing" cx="125" cy="125" r="110" fill="none" stroke="'+(T.mode==='focus'?'var(--accent)':'#34d399')+'" stroke-width="14" stroke-linecap="round" style="stroke-dasharray:'+L+';stroke-dashoffset:0;transition:stroke-dashoffset .5s linear"/></svg><div class="tt-read"><div><b id="tRead" class="num">'+fmtClock(T.left)+'</b><span class="mono small muted">'+(T.mode==='focus'?'FOCUS':'BREAK')+' · #'+(T.count+1)+'</span></div></div></div>'+

    '<button class="btn xs ghost" data-a="logSession">'+ic('plus')+'Log a session manually</button></div></div>'+
  '<div class="card c7"><div class="chead"><h3>Study City</h3><span class="sp"></span><span class="label">'+esc(S.settings.termName)+'</span></div>'+cityHTML(230)+'<p class="small muted" style="margin:10px 0 0">Every '+S.settings.focus+' minutes of focus adds a building in your '+esc(SW().toLowerCase())+'\'s colour. Keep going and watch your city grow all term!</p></div>'+
  '<div class="card c7"><div class="chead"><h3>Study heatmap</h3><span class="muted small">last 18 weeks</span><span class="sp"></span><span class="small">Streak <b>'+streak()+'</b> '+ic('flame')+'</span></div>'+heatHTML()+'<div class="row small muted" style="margin-top:8px;gap:6px">Less <span class="heat" style="display:flex;grid-template-rows:none"><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span> More</div></div>'+
  '<div class="card c5"><div class="chead"><h3>This week by '+esc(SW().toLowerCase())+'</h3><span class="sp"></span><b>'+fmtMin(sum(ws,s=>s.minutes))+'</b></div>'+(Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div style="margin-bottom:10px"><div class="row small" style="margin-bottom:4px"><span>'+esc(k?sName(k):'General')+'</span><span class="sp"></span><b class="num">'+fmtMin(v)+'</b></div><div class="bar"><i style="width:'+(v/mx*100)+'%;background:'+(k?sColor(k):'var(--accent)')+'"></i></div></div>').join(''):emptyBox('No focus time yet this week','Press Start to begin your first session.'))+'</div></div>';

function studyStart(id){const d=S.decks.find(x=>x.id===id);if(!d||!d.cards.length)return;let q=dueCards(d);if(!q.length)q=d.cards.slice();q=q.slice().sort(()=>Math.random()-.5);Q={d,q,i:0,flip:false,good:0,again:0};studyPaint();window.studyClose=()=>{Q=null;render()}}
function studyPaint(){const{d,q,i}=Q;
  if(i>=q.length){openModal('<h2>Session complete!</h2><div class="row" style="gap:20px;margin-bottom:14px"><div class="stat"><span class="k">Remembered</span><span class="big num">'+Q.good+'</span></div><div class="stat"><span class="k">To practise</span><span class="big num">'+Q.again+'</span></div></div><p class="muted">Great work. Missed cards will come back sooner so they stick.</p><div class="mact"><span class="sp"></span><button class="btn pri" data-a="mclose">Done</button></div>');save();return}
  const c=q[i];openModal('<h2>'+esc(d.name)+' <span class="muted small mono">'+(i+1)+'/'+q.length+'</span></h2><div class="fc'+(Q.flip?' flip':'')+'" data-a="flip"><div class="in"><div class="face"><small class="label">Question</small>'+esc(c.front)+'</div><div class="face back"><small class="label">Answer</small>'+esc(c.back)+'</div></div></div>'+

function studyGrade(v){const c=Q.q[Q.i];let b=c.box||1;if(v==='again'){b=1;Q.again++;if(!c._re){c._re=1;Q.q.push(c)}}else{b=Math.min(5,b+(v==='easy'?2:1));Q.good++}
  c.box=b;c.due=addDays(today(),v==='again'?0:INT[b]);delete c._re;Q.i++;Q.flip=false;studyPaint()}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

/* ---------- SEARCH / QUICK ADD / MORE ---------- */
function palette(){openModal('<div class="pal"><input id="palIn" placeholder="Search pages, assignments, exams, notes…" autocomplete="off"><div class="res" id="palRes"></div></div>');const inp=$('#palIn');inp.focus();let sel=0,items=[];
  const run=()=>{const q=inp.value.trim().toLowerCase();items=[];
    Object.entries(PAGEINFO).forEach(([k,v])=>{if(!q||v.t.toLowerCase().includes(q))items.push({l:v.t,k:'Page',i:v.i,f:()=>go(k)})});
    if(q){const add=(arr,lab,kind,icn,f)=>arr.forEach(x=>{if((lab(x)||'').toLowerCase().includes(q))items.push({l:lab(x),k:kind,i:icn,f:()=>f(x)})});
      add(S.assignments,x=>x.title,'Assignment','tasks',x=>{go('assignments');assignForm(x)});add(S.exams,x=>x.title,'Exam','exam',x=>{go('exams')});add(S.subjects,x=>x.name,SW(),'cap',x=>{go('timetable');A.editSubject({id:x.id})});
      add(S.notes,x=>x.title,'Note','note',x=>{UI.note=x.id;go('notes')});add(S.decks,x=>x.name,'Deck','cards',x=>{UI.deck=x.id;go('flashcards')});add(S.opps,x=>x.name,'Opportunity','brief',()=>go('opps'));add(S.projects,x=>x.name,'Project','users',()=>go('projects'));add(S.reading,x=>x.title,'Reading','book',()=>go('reading'));
      S.decks.forEach(d=>d.cards.forEach(c=>{if((c.front+' '+c.back).toLowerCase().includes(q))items.push({l:c.front+' → '+c.back,k:'Flashcard',i:'cards',f:()=>{UI.deck=d.id;go('flashcards')}})}))}
    items=items.slice(0,40);sel=0;paint()};
  const paint=()=>{$('#palRes').innerHTML=items.length?items.map((x,i)=>'<div class="ri'+(i===sel?' sel':'')+'" data-i="'+i+'">'+ic(x.i)+'<span>'+esc(x.l)+'</span><small>'+esc(x.k)+'</small></div>').join(''):'<div class="muted" style="padding:12px">No results</div>'};
  inp.oninput=run;inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(items.length-1,sel+1);paint();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);paint();e.preventDefault()}if(e.key==='Enter'&&items[sel]){const f=items[sel].f;closeModal();f()}};
  $('#palRes').onclick=e=>{const r=e.target.closest('.ri');if(r){const f=items[+r.dataset.i].f;closeModal();f()}};run()}
function quickAdd(){openModal('<h2>Quick add</h2><div class="qadd">'+[['addAssign','tasks','Assignment'],['addExam','exam','Exam'],['addClass','clock','Class'],['logSession','timer','Focus time'],['addCardAny','cards','Flashcard'],['addNote','note','Note'],['addMoneyOut','wallet','Expense'],['addOpp','brief','Opportunity'],['addGrade','chart','Grade']].map(([a,i,l])=>'<button data-a="'+a+'">'+ic(i,'lg')+l+'</button>').join('')+'</div>')}
function morePages(){openModal('<h2>All pages</h2><div class="morepages">'+Object.entries(PAGEINFO).map(([k,v])=>'<button class="'+(page===k?'on':'')+'" data-a="go" data-p="'+k+'">'+ic(v.i,'lg')+esc(v.t)+'</button>').join('')+'</div>')}

/* ---------- export helpers ---------- */
function csvOut(rows){return rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function exportCSV(k){let rows;const sn=id=>id?sName(id):'';
  if(k==='assignments')rows=[['Title',SW(),'Type','Due','Weight %','Status','Steps done','Notes'],...S.assignments.map(a=>[a.title,sn(a.subjectId),a.type,a.due,a.weight,a.status,(a.subtasks||[]).filter(s=>s.done).length+'/'+(a.subtasks||[]).length,a.notes])];
  if(k==='exams')rows=[['Exam',SW(),'Date','Time','Room','Readiness %','Topics'],...S.exams.map(e=>[e.title,sn(e.subjectId),e.date,e.time,e.room,readiness(e),(e.topics||[]).map(t=>t.name).join('; ')])];
  if(k==='grades')rows=[[SW(),'Item','Category','Score','Out of','Percent','Weight %'],...S.grades.map(g=>[sn(g.subjectId),g.name,g.category,g.score,g.max,g.max?(g.score/g.max*100).toFixed(1):'',g.weight])];
  if(k==='sessions')rows=[['Date',SW(),'Minutes'],...S.sessions.map(s=>[s.date,sn(s.subjectId)||'General',s.minutes])];
  if(k==='attendance')rows=[['Date',SW(),'Status'],...S.attendance.map(a=>[a.date,sn(a.subjectId),a.status])];
  if(k==='money')rows=[['Date','Type','Category','Amount','Note'],...S.money.map(m=>[m.date,m.type==='in'?'Income':'Expense',m.cat,m.amount,m.note])];
  if(k==='opps')rows=[['Name','Type','Organisation','Deadline','Status','Notes'],...S.opps.map(o=>[o.name,o.type,o.org,o.deadline,o.status,o.notes])];
  if(k==='reading')rows=[['Title','Author',SW(),'Pages read','Total pages'],...S.reading.map(r=>[r.title,r.author,sn(r.subjectId),r.read,r.pages])];
  if(k==='flash')rows=[['Deck','Front','Back','Box','Next review'],...S.decks.flatMap(d=>d.cards.map(c=>[d.name,c.front,c.back,c.box,c.due]))];
  download('StudyNook-'+k+'-'+today()+'.csv','﻿'+csvOut(rows),'text/csv')}
function exportICS(){const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');const st=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Study Nook//Student Planner//EN','CALSCALE:GREGORIAN'];
  const ev=(id,date,time,title,desc)=>{if(!valid(date))return;const d=date.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+id+'@studynook','DTSTAMP:'+st);if(time){const t=time.replace(':','')+'00';const end=new Date(parse(date).getTime()+toMin(time)*6e4+36e5);L.push('DTSTART:'+d+'T'+t,'DTEND:'+ymd(end).replace(/-/g,'')+'T'+pad(end.getHours())+pad(end.getMinutes())+'00')}else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(date,1).replace(/-/g,''));L.push('SUMMARY:'+e(title),'DESCRIPTION:'+e(desc),'END:VEVENT')};
  S.assignments.filter(a=>a.status!=='done').forEach(a=>ev(a.id,a.due,'','Due: '+a.title,sName(a.subjectId)));S.exams.forEach(x=>ev(x.id,x.date,x.time,'Exam: '+x.title,sName(x.subjectId)+(x.room?' · '+x.room:'')));
  S.opps.forEach(o=>ev(o.id,o.deadline,'','Deadline: '+o.name,o.type||''));S.projects.forEach(p=>{ev(p.id,p.due,'','Project due: '+p.name,'');(p.meetings||[]).forEach(m=>ev(m.id,m.date,m.time,'Group meeting: '+p.name,m.notes))});
  L.push('END:VCALENDAR');download('StudyNook-deadlines.ics',L.join('\r\n'),'text/calendar');toast('Calendar file downloaded. Open it to add your deadlines to your calendar app.')}

    const f=[{k:'subjectId',l:SW(),t:'select',opt:()=>subjOpts(),full:1},{k:'day',l:'Day',t:'select',opt:[1,2,3,4,5,6,0].map(i=>({v:i,l:DOWL[i]}))},{k:'type',l:'Type',t:'select',opt:['Lecture','Seminar','Lab','Tutorial','Discussion','Class','Study group','Other']},{k:'start',l:'Starts',t:'time',req:1},{k:'end',l:'Ends',t:'time',req:1},{k:'room',l:'Room'}];

function confirmLeave(){return true}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const fn=A[t.dataset.a];if(!fn)return;if(t.tagName==='A')e.preventDefault();e.stopPropagation();fn(t.dataset,t,e)});
document.addEventListener('change',e=>{const t=e.target;const c=t.dataset.c;if(!c)return;
  if(c==='asSubj'){UI.asSubj=t.value;render()}
  if(c==='tSubj')T.subjectId=t.value;
  if(c==='tSound'){T.sound=t.value;noise(T.running)}
  if(c==='oppSt'){const o=S.opps.find(x=>x.id===t.dataset.id);o.status=t.value;save();render()}
  if(c==='set'){const k=t.dataset.k;let v=t.value;if(['weekStart','attendMin','focus','short','long'].includes(k))v=Number(v)||0;if(['focus','short','long'].includes(k)){v=clamp(v||1,1,180);if(!T.running){T.total=null;T.left=null}}
    if((k==='termStart'||k==='termEnd')&&!valid(v))return;if(k==='currency'&&!v)v='$';S.settings[k]=v;save();render();toast('Saved')}
  if(c==='setChk'){S.settings[t.dataset.k]=t.checked;save();render();toast('Saved')}
  if(c==='cat'){const l=t.value.split('\n').map(x=>x.trim()).filter(Boolean);if(l.length){S.cats[t.dataset.k]=l;save();toast('Categories saved')}}
  if(c==='importFile'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.settings||!Array.isArray(d.subjects))throw 0;ask({t:'Import this backup?',d:'This replaces everything currently in your planner with the backup from '+(f.name)+'.'},'Import',()=>{S=migrate(d);toast('Backup imported')})}catch(err){toast('That file is not a Study Nook backup')}};r.readAsText(f);t.value=''}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.c==='tVol'){T.vol=Number(t.value);if(NG)NG.gain.value=T.vol*(T.sound==='white'?.35:1)}
  if(t.dataset.n){const n=S.notes.find(x=>x.id===UI.note);if(!n)return;n[t.dataset.n]=t.value;const s=$('#nSaved');if(s)s.textContent='Saving…';clearTimeout(window._nt);window._nt=setTimeout(()=>{save();const s2=$('#nSaved');if(s2)s2.textContent='Saved'},400)}});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.f;if(!k)return;e.preventDefault();const v=(f.elements.t||{}).value?f.elements.t.value.trim():'';
  if(k==='inbox'&&v){S.inbox.unshift({id:uid(),text:v,done:false});save();render()}
  if(k==='topic'&&v){const ex=S.exams.find(x=>x.id===f.dataset.e);ex.topics=ex.topics||[];ex.topics.push({id:uid(),name:v,conf:0});save();render()}
  if(k==='ptask'&&v){const p=S.projects.find(x=>x.id===f.dataset.p);p.tasks.push({id:uid(),text:v,owner:f.elements.o.value,done:false});save();render()}
  if(k==='review'){const wk=weekStartOf(today());let r=S.reviews.find(x=>x.week===wk);if(!r){r={id:uid(),week:wk};S.reviews.push(r)}['wins','hard','next'].forEach(n=>r[n]=f.elements[n].value);save();render();toast('Weekly review saved')}
  if(k==='need'){const cur=parseFloat(f.elements.cur.value),w=parseFloat(f.elements.w.value),g=parseFloat(f.elements.goal.value);UI.need={cur:f.elements.cur.value,w:f.elements.w.value,goal:f.elements.goal.value};
    if(isNaN(cur)||isNaN(w)||isNaN(g)||w<=0||w>100){UI.needOut='Please enter all three numbers (final worth between 1 and 100).'}else{const need=(g-cur*(1-w/100))/(w/100);UI.needOut=need<=0?'You have already reached your goal, even with 0% on the final!':need>100?'You would need '+need.toFixed(1)+'% on the final. That goal may be out of reach, so try a lower goal.':'You need <span class="hlt">'+need.toFixed(1)+'%</span> on the final to reach '+g+'%.'}
    const o=$('#needOut');if(o)o.innerHTML=UI.needOut}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S){e.preventDefault();palette()}
